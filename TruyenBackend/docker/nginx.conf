server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Resolve the optional API at request time; static reading starts without it.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_connect_timeout 2s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /knowledge/ { try_files $uri =404; }
    location /books/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
